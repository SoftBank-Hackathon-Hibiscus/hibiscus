e;border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:0 1px 3px #2f3e4605}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stack>*+*{margin-top:18px}.pill{display:inline-flex;align-items:center;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:650;gap:5px;background:#eceeed;color:var(--muted)}.pill:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.pill.green{color:var(--accent);background:var(--soft)}.pill.red{color:var(--red);background:var(--redsoft)}.pill.amber{color:var(--amber);background:var(--ambersoft)}.pill.blue{color:var(--blue);background:var(--bluesoft)}.label{font-size:12px;color:var(--muted)}.big{font-size:29px;letter-spacing:-.8px;font-weight:700;margin-top:4px}.big small{font-size:13px;letter-spacing:0;font-weight:400;color:var(--muted)}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:12px}.muted{color:var(--muted)}.fine{font-size:12px;color:var(--muted)}.note{padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:#fafbfa;font-size:13px}.note.amber{background:#fffaf1;border-color:#eadfc9}.note.red{background:#fdf6f7;border-color:#efd8dc}.note strong{display:block;margin-bottom:4px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:16px 0 0}.facts dt{font-size:11px;color:var(--muted)}.facts dd{margin:4px 0 0;font-size:13px}table{width:100%;border-collapse:collapse;text-align:left}th{font-weight:500;font-size:11px;color:var(--muted);padding:0 10px 12px}td{padding:14px 10px;border-top:1px solid var(--line);font-size:13px}th:first-child,td:first-child{padding-left:0}tr.selectable{cursor:pointer}tr.selectable:hover{background:#f7f9f8}.tablewrap{overflow:auto}.tablewrap table{min-width:550px}.stages{display:grid;grid-template-columns:repeat(5,1fr);padding:22px 12px}.stage{position:relative;text-align:center}.stage:not(:last-child):after{content:'';position:absolute;left:calc(50% + 18px);right:calc(-50% + 18px);height:1px;top:15px;background:var(--line)}.stage-dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:#eef0ef;color:var(--muted);display:grid;place-items:center;margin:0 auto 10px}.stage-dot.green{background:var(--soft);color:var(--accent)}.stage-dot.red{background:var(--redsoft);color:var(--red)}.stage-dot.amber{background:var(--ambersoft);color:var(--amber)}.stage-dot.blue{background:var(--bluesoft);color:var(--blue)}.stage-name{font-size:12px;font-weight:650}.stage-result{font-size:11px;color:var(--muted);margin-top:3px}.summaryline{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.summarytitle{font-size:18px;font-weight:700;letter-spacing:-.3px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-head h2{margin:0}.buttonlink{background:none;border:0;padding:0;color:var(--accent);font-size:12px}.failure{border-left:3px solid var(--red)}.error-facts{display:grid;grid-template-columns:90px 1fr;gap:10px;margin:14px 0}.error-facts dt{color:var(--muted);font-size:12px}.error-facts dd{margin:0;font-size:13px;overflow-wrap:anywhere}.terminal{background:#202c33;color:#d4dfdf;border-radius:9px;padding:16px 18px;overflow:auto;font:12px/1.9 'SFMono-Regular',Consolas,monospace;min-height:260px;max-height:440px}.logrow{white-space:pre-wrap;overflow-wrap:anywhere}.logtime{color:#7e929b}.loglevel{display:inline-block;min-width:55px;color:#9ac0b2}.loglevel.error{color:#efa1ab}.loglevel.warn{color:#e4c18a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input{flex:1;min-width:150px}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:white;color:var(--ink);max-width:100%;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #5e8b7e55;border-color:var(--accent)}input:disabled,select:disabled{background:#f5f6f5;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;font-size:12px}.field input,.field select{width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;gap:9px;align-items:center;font-size:13px}.check input{accent-color:var(--accent)}.envgrid{display:grid;grid-template-columns:1.2fr 1.5fr auto;gap:8px;margin-top:10px}.envgrid input{width:100%;font-size:12px}.envgrid button{padding:5px 10px}.env-head{font-size:11px;color:var(--muted)}.sticky{position:sticky;bottom:16px;background:#fffffff2;backdrop-filter:blur(12px);padding:13px 18px;border:1px solid var(--line);border-radius:11px;margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 5px 24px #24332d0d}.save-message{font-size:12px;color:var(--accent)}.chart{height:155px;display:flex;align-items:flex-end;gap:5px;padding-top:20px}.bar{flex:1;background:#bed4cb;border-radius:3px 3px 0 0;min-width:4px;position:relative}.bar:hover{background:var(--accent)}.chart-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:8px}.route{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.route-destination{background:#f6f8f6;border:1px solid var(--line);border-radius:10px;padding:16px 20px;flex:1;min-width:190px}.route-destination.active{border-color:#b6cec3;background:#f5faf7}.route-title{font-size:17px;font-weight:650;margin:6px 0}.loginwrap{min-height:70vh;display:grid;place-items:center}.login{width:min(380px,100%);padding:36px;text-align:center}.login h1{font-size:23px}.login p{font-size:13px;color:var(--muted);margin:12px 0 24px}.login .primary{width:100%;padding:12px}.login-foot{margin-top:20px;font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:white;padding:12px 18px;border-radius:9px;font-size:13px;max-width:calc(100vw - 48px);z-index:30}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:14px;max-width:520px;width:calc(100% - 40px);padding:24px;color:var(--ink)}dialog::backdrop{background:#25332c66}dialog textarea{width:100%;min-height:180px;font:12px/1.7 monospace}.dialogtitle{font-size:17px;margin-bottom:8px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.text-red{color:var(--red)}.legend{font-size:11px;color:var(--muted);padding:10px 0}.scenario{font-size:11px;background:#f9faf9}.headtools select{max-width:190px;font-size:11px}.details{padding-top:14px;border-top:1px solid var(--line);margin-top:16px}.details summary{cursor:pointer;font-size:12px;color:var(--muted)}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:760px){.header{padding:0 18px}.shell{padding:24px 18px}.grid{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.title{align-items:flex-start;flex-direction:column}.facts{grid-template-columns:1fr 1fr}.tabs{gap:22px}.account{display:none}.headtools{gap:5px}.headtools select{max-width:140px}.formgrid{grid-template-columns:1fr}.envgrid{grid-template-columns:1fr 1fr auto}.card{padding:18px}.summaryline{flex-direction:column}.stages{padding:18px 5px}.stage-name{font-size:11px}.stage-result{font-size:10px}.sticky{flex-wrap:wrap}.big{font-size:24px}.route{gap:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.react-flow__node{width:230px!important;padding:18px!important;border-radius:10px!important;font-size:13px!important;color:#2f3e46!important;line-height:1.8!important}.react-flow__node small{color:#6c7b78}.react-flow__controls button{padding:0}.react-flow__edge-text{font-size:12px}tr.selectable:hover{background:#f1f7f4}</style>
</head>
<body>
<header class="header"><div class="brand"><span class="brandmark" aria-hidden="true">H</span>Hibiscus <span class="demo">UI DEMO</span></div><div class="row headtools"><select id="scenario" aria-label="데모 상태 선택"><option value="failed">검증 실패 · 기존 버전 유지</option><option value="allowed">검증 실패 · 배포 허용</option><option value="success">검증 통과 · 배포 완료</option><option value="build">이미지 빌드 실패</option></select><span class="account">@taehyun</span><button id="authButton">로그인 화면</button></div></header>
<main class="shell" id="main"></main>
<dialog id="bulkDialog"><h2 class="dialogtitle">환경변수 붙여넣기</h2><p class="fine">같은 이름은 값을 교체합니다. 나머지 항목은 유지합니다.</p><textarea id="bulkInput" aria-label="붙여넣을 환경변수" placeholder="APP_MODE=production&#10;LOG_LEVEL=info"></textarea><p id="bulkError" class="fine text-red" role="alert"></p><div class="row" style="justify-content:flex-end;margin-top:16px"><button id="closeBulk">취소</button><button class="primary" id="applyBulk">추가</button></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<link rel="stylesheet" href="service-flow.css"><script src="service-flow.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={overview:'개요',deployments:'배포',logs:'로그',traffic:'트래픽',settings:'배포 설정'};
let page=Object.hasOwn(names,location.hash.slice(1))?location.hash.slice(1):'deployments';
let signedIn=true, scenario='failed', dirty=false, autoLogs=true, logTimer, toastTimer, selectedVersion=null, trafficWindow='5', logVersion='v7', logLevel='all', logSearch='', logRange='5';
const initialConfig={health:{enabled:true,path:'/health',method:'GET',interval:10,timeout:5,statusMin:200,statusMax:399,success:2,failure:3},env:[{name:'MYSQL_HOST',value:'',stored:true},{name:'MYSQL_DATABASE',value:'',stored:true},{name:'MYSQL_PASSWORD',value:'',stored:true},{name:'S3_BUCKET',value:'',stored:true},{name:'AWS_SECRET_ACCESS_KEY',value:'',stored:true},{name:'PORT',value:'',stored:true}],testEnv:[{name:'MYSQL_HOST',value:'',stored:true},{name:'MYSQL_DATABASE',value:'',stored:true}]};
let saved=structuredClone(initialConfig),draft=structuredClone(saved), created=[];
let logs=[{time:'21:42:10',level:'INFO',version:'v7',text:'Server listening on :8080'},{time:'21:42:10',level:'INFO',version:'v7',text:'MySQL connection established · database=app'},{time:'21:42:11',level:'INFO',version:'v7',text:'GET /health 200 · 12 ms'},{time:'21:42:14',level:'INFO',version:'v7',text:'GET /posts 200 · 48 ms'},{time:'21:42:18',level:'WARN',version:'v7',text:'Database pool wait · 148 ms'},{time:'21:42:20',level:'INFO',version:'v7',text:'POST /posts 201 · 63 ms'},{time:'21:44:02',level:'INFO',version:'v8',text:'Validation container started · revision=8c3e51a'},{time:'21:44:07',level:'ERROR',version:'v8',text:'mysql.connect ETIMEDOUT · host=10.0.0.12 port=3306'},{time:'21:44:07',level:'ERROR',version:'v8',text:'GET /health 500 · 5003 ms'},{time:'21:44:07',level:'WARN',version:'v8',text:'Validation stopped · expected HTTP 200–399, received 500'}];
logs.forEach((entry,i)=>entry.age=i<2?20:i<4?8:1);
const pill=(text,tone='')=>`<span class="pill ${tone}">${esc(text)}</span>`;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;
const mockTime=()=>new Date().toLocaleTimeString('ko-KR',{hour12:false});
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function active(){return scenario==='success'||scenario==='allowed'?'v8':'v7'}
function latest(){return created[0]||{version:'v8',status:scenario==='success'||scenario==='allowed'?'succeeded':'failed',stage:scenario==='build'?'빌드':'검증'}}
function title(){return `<div class="crumb">애플리케이션 / demo-app</div><div class="title"><div><h1>demo-app</h1><p class="subtitle">SoftBank-Hackathon-Hibiscus/demo-app <span class="mono">· main</span></p></div><div class="row"><button data-act="newDeploy">새 배포</button><button class="primary" data-go="settings">배포 설정</button></div></div><nav class="tabs" aria-label="애플리케이션 메뉴">${Object.entries(names).map(([key,label])=>`<button data-go="${key}" class="${page===key?'active':''}" ${page===key?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`}
function render(){window.unmountServiceFlow?.();clearInterval(logTimer);$('#authButton').textContent=signedIn?'로그인 화면':'콘솔 보기';$('#scenario').disabled=!signedIn;$('#main').innerHTML=signedIn?title()+({overview,deployments,logs:logsPage,traffic,settings}[page])():login();bind();if(page==='logs'&&signedIn&&autoLogs){logTimer=setInterval(()=>{const n=logs.length;logs.push({time:mockTime(),level:n%7===0?'WARN':'INFO',version:'v7',text:n%7===0?'Database pool wait · 108 ms':'GET /posts 200 · '+(35+n%30)+' ms'});if(logs.length>150)logs.shift();renderLogs()},3000)}}
function navigate(next){if(next==='deployments')selectedVersion=null;if(page==='settings'&&dirty&&next!=='settings'&&!confirm('저장하지 않은 변경을 버리고 이동할까요?'))return;if(page==='settings'&&next!=='settings'){draft=structuredClone(saved);dirty=false}page=next;history.replaceState(null,'','#'+next);render();window.scrollTo({top:0,behavior:'instant'})}
function overview(){const last=latest();return `<div class="stack"><div class="grid">${card('현재 서비스',`<div class="summaryline"><div><div class="summarytitle">${active()} · Cloud Run</div><p class="fine">${scenario==='allowed'?'검증 실패 후 정책 허용으로 배포':'최근 상태 확인 8초 전'}</p></div>${pill('정상','green')}</div><div class="facts"><div><dt>공개 주소</dt><dd class="mono">demo-app.apps.example</dd></div><div><dt>Health Check</dt><dd>${saved.health.enabled?'HTTP 200 · 12 ms':'확인 안 함'}</dd></div><div><dt>대기 대상</dt><dd>On-Prem · 정상</dd></div></div>`)}${card('최근 배포',`<div class="summaryline"><div><div class="summarytitle">${last.version}</div><p class="fine">main · 8c3e51a · @taehyun</p></div>${pill(last.status==='failed'?'배포 실패':last.status==='queued'?'배포 대기':last.status==='cancelled'?'취소됨':'배포 완료',last.status==='failed'?'red':last.status==='queued'?'blue':last.status==='cancelled'?'':'green')}</div><p>${last.status==='failed'?`${last.stage} 단계에서 멈췄습니다. ${active()}이 서비스 중입니다.`:'배포 상세에서 단계별 결과를 확인하세요.'}</p><button class="buttonlink" data-go="deployments">배포 상세 보기 →</button>`)}</div><div class="grid4">${metric('초당 요청','4.3건/초','최근 5분 평균')}${metric('오류율','0.8%','5xx / 완료 요청')}${metric('p95 응답 시간','182','ms')}${metric('가동 대상','2','현재 1 · 대기 1')}</div>${card('최근 배포 이력',historyTable())}<div class="legend">이 화면은 가상 데이터입니다. 서버·클라우드·DB에 요청하지 않습니다.</div></div>`}
function metric(label,value,unit,period='5'){return `<div class="card"><div class="label">${label}</div><div class="big">${value} <small>${unit==='ms'?'ms':''}</small></div><div class="fine">${unit==='ms'?`최근 ${period}분`:unit}</div></div>`}
function historyTable(){const latestRow=latest();return `<div class="tablewrap"><table><thead><tr><th>버전</th><th>커밋</th><th>시작 방식</th><th>배포 결과</th><th>시각</th></tr></thead><tbody>${created.map(d=>`<tr class="selectable" data-version="${d.version}"><td>${d.version}</td><td class="mono">8c3e51a</td><td>${d.trigger||'수동'}</td><td>${pill(d.status==='queued'?'대기':d.status==='cancelled'?'취소됨':'완료',d.status==='queued'?'blue':'')}</td><td>${d.time}</td></tr>`).join('')}<tr class="selectable" data-version="v8"><td><button class="buttonlink" data-version="v8" aria-label="v8 배포 상세">v8</button> ${active()==='v8'?pill('서비스 중','green'):''}</td><td class="mono">8c3e51a</td><td>GitHub push</td><td>${pill(scenario==='failed'||scenario==='build'?'실패':'완료',scenario==='failed'||scenario==='build'?'red':'green')}</td><td>21:44</td></tr><tr class="selectable" data-version="v7"><td><button class="buttonlink" data-version="v7" aria-label="v7 배포 상세">v7</button> ${active()==='v7'?pill('서비스 중','green'):''}</td><td class="mono">6f9b231</td><td>수동</td><td>${pill('완료','green')}</td><td>21:30</td></tr><tr class="selectable" data-version="v6"><td><button class="buttonlink" data-version="v6" aria-label="v6 배포 상세">v6</button></td><td class="mono">0d7aa19</td><td>수동</td><td>${pill('완료','green')}</td><td>20:18</td></tr></tbody></table></div>`}

function saveSettings(deploy){const error=validateSettings();if(error){$('#settingsError').textContent=error;return}saved=structuredClone(draft);for(const kind of ['env','testEnv'])saved[kind].forEach(r=>{r.stored=true;r.value=''});draft=structuredClone(saved);dirty=false;if(deploy)createDeployment('설정 변경');else{render();notify('설정을 저장했습니다. 다음 배포부터 적용됩니다.')}}
function createDeployment(trigger='수동'){if(page==='settings'&&dirty){notify('설정을 저장하거나 변경을 취소하세요.');return}const row={version:'v'+(9+created.length),status:'queued',trigger,time:mockTime()};created.unshift(row);selectedVersion=row.version;page='deployments';history.replaceState(null,'','#deployments');render();notify('데모 배포를 만들었습니다. 실제 배포는 실행하지 않습니다.')}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{navigate('deployments');selectedVersion=b.dataset.version;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));document.querySelectorAll('[data-health]').forEach(el=>el.oninput=()=>{draft.health[el.dataset.health]=el.type==='number'?Number(el.value):el.value;markDirty()});if($('#healthEnabled'))$('#healthEnabled').onchange=e=>{draft.health.enabled=e.target.checked;markDirty();render()};document.querySelectorAll('[data-env-kind]').forEach(el=>el.oninput=()=>{draft[el.dataset.envKind][Number(el.dataset.envIndex)][el.dataset.envField]=el.value;markDirty()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{draft[b.dataset.add].push({name:'',value:'',stored:false});markDirty();render()});document.querySelectorAll('[data-remove-kind]').forEach(b=>b.onclick=()=>{draft[b.dataset.removeKind].splice(Number(b.dataset.removeIndex),1);markDirty();render()});document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>{bulkKind=b.dataset.bulk;$('#bulkInput').value='';$('#bulkError').textContent='';$('#bulkDialog').showModal()});if($('#logRows')){renderLogs();$('#logVersion').onchange=e=>{logVersion=e.target.value;renderLogs()};$('#logLevel').onchange=e=>{logLevel=e.target.value;renderLogs()};$('#logSearch').oninput=e=>{logSearch=e.target.value;renderLogs()};$('#logRange').onchange=e=>{logRange=e.target.value;renderLogs()}}if($('#serviceFlow'))window.mountServiceFlow($('#serviceFlow'),active());if($('#trafficWindow'))$('#trafficWindow').onchange=e=>{trafficWindow=e.target.value;render()}}
function action(act){if(act==='deploymentList'){selectedVersion=null;render();return}if(act==='login'){signedIn=true;page='overview';render();return}if(act==='newDeploy'||act==='retry'){createDeployment();return}if(act==='cancel'){const row=created.find(d=>d.version===selectedVersion);if(row)row.status='cancelled';render();notify('대기 중인 배포를 취소했습니다.');return}if(act==='rollback'){if(created.some(d=>d.status==='queued')){notify('대기 중인 배포를 먼저 취소하세요.');return}if(confirm('v6의 커밋과 환경변수로 데모 배포를 만들까요?'))createDeployment('롤백 · v6');return}if(act==='showPolicy'){notify('테스트 차단 규칙 비활성 · 정책 판단 ALLOW · 가상 정책');return}if(act==='validationLogs'){logVersion='v8';logLevel='all';logSearch='';navigate('logs');return}if(act==='pause'){autoLogs=!autoLogs;render();return}if(act==='discard'){draft=structuredClone(saved);dirty=false;render();return}if(act==='save'||act==='saveDeploy'){saveSettings(act==='saveDeploy');return}}
let bulkKind='env';$('#closeBulk').onclick=()=>$('#bulkDialog').close();$('#applyBulk').onclick=()=>{const parsed=[];for(const line of $('#bulkInput').value.split('\n')){const text=line.trim();if(!text||text.startsWith('#'))continue;const at=text.indexOf('=');if(at<1){$('#bulkError').textContent='이름=값 형식으로 입력하세요.';return}const name=text.slice(0,at).trim();let value=text.slice(at+1);if(!/^[A-Z_][A-Z0-9_]*$/.test(name)){$('#bulkError').textContent='환경변수 이름을 확인하세요.';return}if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'")))value=value.slice(1,-1);parsed.push({name,value,stored:false})}if(!parsed.length){$('#bulkError').textContent='추가할 항목을 입력하세요.';return}for(const row of parsed){const existing=draft[bulkKind].find(r=>r.name===row.name);if(existing)existing.value=row.value;else draft[bulkKind].push(row)}markDirty();$('#bulkDialog').close();render();notify(parsed.length+'개 항목을 입력했습니다. 저장하면 적용됩니다.')};
$('#authButton').onclick=()=>{if(dirty&&!confirm('저장하지 않은 변경을 버릴까요?'))return;dirty=false;draft=structuredClone(saved);signedIn=!signedIn;render()};$('#scenario').onchange=e=>{scenario=e.target.value;selectedVersion='v8';created=[];render()};render();
</script>
</body>
</html>
